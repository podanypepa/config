set -g prefix C-a
unbind C-b
bind C-a send-prefix
set -sg escape-time 0
set -g status-interval 15
set -g history-limit 50000
set -g mode-keys vi
set -g base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=default"
set -g window-status-current-style "fg=green,bold"
set-option -g status-right ""
set -g status-left-length 40
set -g status-left '#[fg=white,bold]#S '
bind r source-file ~/.tmux.conf \; display "config reloaded"
# Ghostty opacity (cmd+shift+= / - / 0 posilaji prefix + / _ / |)
bind + run-shell "~/src/config/ghostty/opacity.sh up"
bind _ run-shell "~/src/config/ghostty/opacity.sh down"
bind | run-shell "~/src/config/ghostty/opacity.sh reset"
# Prepinani session / projektu (zoxide) pres fzf v popupu
set -g popup-style "bg=default"
set -g popup-border-style "fg=#444444"
set -g popup-border-lines rounded
bind f display-popup -E -w 60% -h 60% "~/src/config/tmux/sessionizer.sh"
bind c new-window -c "#{pane_current_path}"
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"
bind -n S-Left  previous-window
bind -n S-Right next-window
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# C-h/j/k/l: v nvim (@pane-is-vim nastavuje init.lua) a fzf posli klavesu dal,
# jinak prepni pane. Clear screen v shellu = prefix + C-l
bind -n C-h if -F '#{||:#{@pane-is-vim},#{==:#{pane_current_command},fzf}}' { send-keys C-h } { select-pane -L }
bind -n C-j if -F '#{||:#{@pane-is-vim},#{==:#{pane_current_command},fzf}}' { send-keys C-j } { select-pane -D }
bind -n C-k if -F '#{||:#{@pane-is-vim},#{==:#{pane_current_command},fzf}}' { send-keys C-k } { select-pane -U }
bind -n C-l if -F '#{||:#{@pane-is-vim},#{==:#{pane_current_command},fzf}}' { send-keys C-l } { select-pane -R }
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
bind C-l send-keys C-l
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Alt bindingy misto Ghostty tabu (Ghostty: macos-option-as-alt = left)
# M-b/M-f zamerne volne = zsh/readline slovo zpet/vpred
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9
bind -n M-t new-window -c "#{pane_current_path}"
set -g mouse on
set-option -g focus-events on
set -g default-terminal "tmux-256color"
# True color; zbytek (kurzor, clipboard, extkeys) tmux 3.8 zjisti z terminalu sam
set -as terminal-features ',*:RGB'
# Shift+Enter, Ctrl+Enter, Ctrl+i vs Tab apod. pro nvim / Claude Code
set -s extended-keys on
set -as terminal-features ',*:extkeys'
set -s copy-command 'pbcopy'
set -g @open 'O'
set -g @override_copy_command 'pbcopy'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
# Sessions prezijí restart Macu: continuum uklada kazdych 15 min, po startu
# tmux serveru vse obnovi. Rucne: prefix C-s ulozit, prefix C-r obnovit.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
# Claude Code se obnovi s posledni konverzaci v danem adresari
set -g @resurrect-processes '"~claude->claude --continue"'
run '~/.tmux/plugins/tpm/tpm'
# Mys: po oznaceni zkopirovat do clipboardu a nechat oznaceni viditelne
# (musi byt az za tpm, jinak to prepise tmux-yank)
# Dalsi klavesa ukonci copy-mode a posle se do shellu (tabulka mousecopy)
bind -T copy-mode-vi MouseDragEnd1Pane { send -X copy-pipe-no-clear "pbcopy" ; switch-client -T mousecopy }
bind -T copy-mode    MouseDragEnd1Pane { send -X copy-pipe-no-clear "pbcopy" ; switch-client -T mousecopy }
source-file ~/src/config/tmux/mouse-copy.conf
