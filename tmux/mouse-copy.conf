# Vygenerovano: po oznaceni mysi (MouseDragEnd1Pane) prepne klienta do tabulky
# mousecopy. Dalsi klavesa ukonci copy-mode a posle se do shellu.
# Klavesy, ktere tu nejsou (mys, prefix, M-*), propadnou do root tabulky.
